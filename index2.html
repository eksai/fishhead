<script>

function bgcolor(){
 function rndNum(){return Math.floor(Math.random()*(255-225+1))+225;}
 var rndColor = rndNum()+','+rndNum()+','+rndNum();
 jQuery('body').css('background','rgb('+rndColor+')'); 
}
bgcolor();

jQuery('*').click(function(){bgcolor();});

jQuery('.lock').click(function(){ alert('You must find the unlock combination'); });

var intervalId = window.setInterval(function(){
 bgcolor();
}, 5000);

/* make it so only one sound file plays at a time */
document.addEventListener('play', function(e){  
 var audios = document.getElementsByTagName('audio');  
 for(var i = 0, len = audios.length; i < len;i++){  
   if(audios[i] != e.target){
     audios[i].pause();
     audios[i].currentTime = 0;
   }  
 }
}, true);

</script>
